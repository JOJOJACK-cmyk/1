plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.16'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.gimpo'
version = '0.0.1-SNAPSHOT'

// toolchain 대신 release 로 바이트코드 버전만 21 에 맞춘다.
// 그러면 JDK 21 이상(21~25)이 하나만 깔려 있어도 별도 JDK 다운로드 없이 빌드된다.
tasks.withType(JavaCompile).configureEach {
    options.release = 21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.apache.commons:commons-csv:1.14.0'
    runtimeOnly 'com.h2database:h2'
    // hibernate-core 가 런타임에 쓰는 라이브러리인데 IntelliJ 가 만든 실행 클래스패스에서
    // 이것만 빠져 NoClassDefFoundError(com/fasterxml/classmate/TypeResolver)가 난 적이 있다.
    // Gradle 로 직접 선언해 두면 IDE 모델에도 최상위 의존성으로 들어간다. (버전은 Spring Boot BOM)
    runtimeOnly 'com.fasterxml:classmate'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}
