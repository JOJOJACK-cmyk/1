server:
  # 8080 은 다른 Spring Boot 프로젝트와 겹치기 쉬워 8081 을 쓴다.
  # 바꾸려면 프로그램 인수 --server.port=9090 또는 환경변수 SERVER_PORT=9090
  port: 8081

spring:
  datasource:
    # 로컬 파일 DB. 서버를 껐다 켜도 적재한 데이터가 남는다. (MySQL 등으로 바꿀 땐 url/driver만 교체)
    url: jdbc:h2:file:./data/gimpo-biz;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          batch_size: 500
        order_inserts: true

app:
  import:
    # 서버가 시작될 때 이 폴더의 *.csv 를 자동으로 적재한다 (폴더가 없으면 건너뜀). 같은 파일은 중복 없이 갱신.
    path: import/
    region-keyword: 김포시
    batch-size: 500
  fetch:
    # true 면 서버 시작 때 아래 주소에서 CSV(또는 CSV가 든 zip)를 내려받아 import/ 에 저장한 뒤 적재한다.
    # 받아 둔 파일이 max-age-days 이내면 다시 받지 않고, 내려받기에 실패해도 서버는 정상 시작한다.
    enabled: true
    max-age-days: 7
    sources:
      - name: rest_cafes        # 저장 파일명: import/rest_cafes.csv
        url: https://file.localdata.go.kr/file/download/rest_cafes/info
